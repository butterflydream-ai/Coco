name: Plugins

# Validates plugin manifests AND checks that the artifacts this repo serves
# (plugins/index.json, plugins/zips/, plugins/icons/) were regenerated after
# the source under plugins-src/ changed.
#
# The freshness check is the point. The build is run by hand, so the failure
# it guards against is a plugin edited and merged without `npm run build` —
# the site and the app keep serving the previous zip, and nothing anywhere
# says so.

on:
  push:
    branches: [main]
    paths: ["plugins-src/**", "plugins/**", ".github/workflows/plugins-ci.yml"]
  pull_request:
    paths: ["plugins-src/**", "plugins/**", ".github/workflows/plugins-ci.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate manifests + index generation
        run: npm test
        working-directory: plugins-src

      - name: Rebuild artifacts
        run: npm run build
        working-directory: plugins-src

      - name: Served index agrees with the served zips
        run: |
          # The invariant the installer depends on (Store invariant I1): the
          # sha256 in index.json is the sha256 of the zip at download_url.
          fail=0
          while read -r name sha; do
            actual=$(sha256sum "plugins/zips/$name" | cut -d' ' -f1)
            if [ "$actual" != "$sha" ]; then
              echo "::error::plugins/zips/$name: index says $sha, file is $actual"
              fail=1
            fi
          done < <(jq -r '.plugins[] | "\(.download_url | split("/") | last) \(.sha256)"' plugins/index.json)
          exit $fail

      - name: Served artifacts match a fresh build
        run: |
          # Compared by CONTENT, not by bytes: the zips are built by hand on a
          # maintainer's Mac and here by Info-ZIP on Linux, and nothing
          # guarantees two deflate implementations emit identical bytes for
          # identical input. Comparing the file list plus each member's hash
          # catches every substantive drift — a plugin edited without
          # rebuilding — without turning a compressor difference into a
          # red build.
          fail=0
          fresh=$(jq 'del(.updated_at) | .plugins |= map(del(.sha256))' plugins-src/dist/index.json)
          served=$(jq 'del(.updated_at) | .plugins |= map(del(.sha256))' plugins/index.json)
          if [ "$fresh" != "$served" ]; then
            echo "::error::plugins/index.json is stale. Run 'npm run build' in"
            echo "::error::plugins-src/ and copy dist/ over plugins/ (see its README)."
            diff <(echo "$served") <(echo "$fresh") || true
            fail=1
          fi
          manifest_of() {
            local zip="$1" dir
            dir=$(mktemp -d)
            unzip -qq "$zip" -d "$dir"
            (cd "$dir" && find . -type f | sort | xargs -r sha256sum)
            rm -rf "$dir"
          }
          for f in plugins-src/dist/zips/*.zip; do
            name=$(basename "$f")
            if [ ! -f "plugins/zips/$name" ]; then
              echo "::error::plugins/zips/$name is missing — artifacts were not regenerated."
              fail=1
              continue
            fi
            if ! diff <(manifest_of "plugins/zips/$name") <(manifest_of "$f") > /dev/null; then
              echo "::error::plugins/zips/$name content differs from a fresh build."
              diff <(manifest_of "plugins/zips/$name") <(manifest_of "$f") || true
              fail=1
            fi
          done
          for f in plugins-src/dist/icons/*.png; do
            name=$(basename "$f")
            cmp -s "$f" "plugins/icons/$name" || {
              echo "::error::plugins/icons/$name differs from a fresh build."
              fail=1
            }
          done
          [ $fail -eq 0 ] && echo "served artifacts are up to date"
          exit $fail
